name: 更新中国区 GitHub 数据

on:
  schedule:
    # 每天凌晨 3 点执行（UTC 时间 19:00，即北京时间 03:00）
    - cron: "0 19 * * *"
  workflow_dispatch: # 允许手动触发

permissions: {}

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 提交并推送数据文件
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 设置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 抓取 GitHub 用户数据
        env:
          GITHUB_TOKEN: ${{ secrets.FETCH_TOKEN }}
        run: pnpm run fetch-data

      - name: 提交并推送更新数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/github-ranking.json
          if git commit -m "更新: GitHub 中国区用户排行榜数据 [skip ci]"; then
            git push origin HEAD:main
          else
            echo "没有更新"
          fi
